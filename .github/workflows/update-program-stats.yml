name: Run test.py

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run test.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python test.py
